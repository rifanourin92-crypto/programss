<!DOCTYPE html>
 <html>
     <head> 
            <title>Registration</title> 
                <link rel="stylesheet" href="styles.css">
             </head> 
             <body>
                 <header>  
                       <h1>Event Registration</h1>
                     </header>
                      <nav>  
                           <a href="index.html">Home</a>
                                <a href="events.html">Events</a>
                                     <a href="registration.html">Register</a>
                                     </nav>
                                      <div class="content">  
                                           <h2>Student Registration</h2> 
                                               <form onsubmit="registerStudent(event)"> 
                <label>Name:</label>  
              <input type="text" id="name" required> <br> 
            <label>Email:</label>   
                  <input type="email" required> <br>  
                         <label>Department:</label>   
                               <input type="text" required> <br>  
                                      <label>Select Event:</label> 
                                              <select id="event" required> 
                                                            <option value="">Select Event</option> 
                                                                        <option>Web Development Workshop</option> 
                                                                                    <option>Quiz Competition</option>
                                                                                                 <option>Coding Competition</option>
                                                                                                         </select>
                                                                                                          <br> 
                                                                                                                  <button type="submit">Register</button> 
                                                                                                                    </form>     <p id="message"></p> </div> <script> function registerStudent(event) {     event.preventDefault();     let name = document.getElementById("name").value;     let eventName = document.getElementById("event").value;     document.getElementById("message").innerHTML =         "Successfully Registered!<br>" +         "Welcome " + name + ".<br>" +         "Event: " + eventName;     document.getElementById("message").style.display = "block"; } </script> </body> </html>
